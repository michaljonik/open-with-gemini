<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>YT → Gemini — Settings</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      max-width: 480px;
      margin: 2rem auto;
      color: #202124;
    }
    h1 { font-size: 1.1rem; }
    label { display: block; margin-top: 1rem; font-weight: 600; }
    textarea {
      width: 100%;
      box-sizing: border-box;
      min-height: 80px;
      margin-top: 0.4rem;
      font-family: inherit;
      font-size: 0.95rem;
      padding: 0.5rem;
    }
    .hint { color: #5f6368; font-size: 0.85rem; margin-top: 0.3rem; }
    button {
      margin-top: 1rem;
      padding: 0.5rem 1.2rem;
      background: #4285f4;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.95rem;
    }
    button:hover { background: #3367d6; }
    #status { margin-left: 0.8rem; color: #188038; font-size: 0.9rem; }
  </style>
</head>
<body>
  <h1>YT → Gemini — Prompt template</h1>

  <label for="promptTemplate">Prompt sent to Gemini</label>
  <textarea id="promptTemplate"></textarea>
  <p class="hint">Must include <code>{url}</code> — it gets replaced with the video link.</p>

  <button id="save">Save</button>
  <span id="status"></span>

  <script src="options.js"></script>
</body>
</html>
